<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoS/DDoS攻撃リアルタイム検知 SOCダッシュボード</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --accent-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Consolas, "Courier New", Courier, monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 1px;
            color: var(--accent-blue);
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
        }

        .status-badge.connected {
            color: var(--accent-green);
            border-color: var(--accent-green);
        }

        .status-badge.disconnected {
            color: var(--accent-red);
            border-color: var(--accent-red);
        }

        .controls {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .controls input[type="text"] {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 4px;
            flex-grow: 1;
        }

        button {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 1024px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
        }

        .panel h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .chart-wrapper {
            position: relative;
            height: 250px;
        }

        .log-container {
            height: 250px;
            overflow-y: auto;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            font-size: 0.85rem;
        }

        .log-item {
            padding: 4px 6px;
            border-bottom: 1px solid #1a2234;
            display: flex;
            justify-content: space-between;
        }

        .log-item.blocked {
            color: var(--accent-red);
            background: rgba(239, 68, 68, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            background: var(--bg-color);
        }

        .unblock-btn {
            background: var(--accent-red);
            padding: 4px 8px;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>[SOC] DoS/DDoS リアルタイム監視ダッシュボード</h1>
        <div id="connectionStatus" class="status-badge disconnected">未接続</div>
    </header>

    <div class="controls">
        <label for="wsUrl">WebSocket URL:</label>
        <input type="text" id="wsUrl" value="ws://localhost:8765">
        <button id="connectBtn" onclick="toggleConnection()">接続</button>
    </div>

    <div class="grid-container">
        <!-- リアルタイムチャート -->
        <div class="panel">
            <h2>トラフィック推移 (RPS / 秒間リクエスト)</h2>
            <div class="chart-wrapper">
                <canvas id="trafficChart"></canvas>
            </div>
        </div>

        <!-- ライブログストリーム -->
        <div class="panel">
            <h2>ライブアクセスログ</h2>
            <div id="logStream" class="log-container">
                <div class="log-item" style="color: var(--text-muted);">サーバーからのログ待ち受け中...</div>
            </div>
        </div>
    </div>

    <!-- ブロックIP管理テーブル -->
    <div class="panel">
        <h2>自動ブロック中クライアント一覧 (要認証解除)</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>IPアドレス</th>
                        <th>検知ステータス</th>
                        <th>アクション</th>
                    </tr>
                </thead>
                <tbody id="blockedListTable">
                    <tr>
                        <td colspan="3" style="text-align: center; color: var(--text-muted);">現在ブロック中のIPはありません</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let ws = null;
        let trafficChart = null;
        const blockedIPsMap = new Map(); // IP -> 状態管理用

        // Chart.js の初期化
        function initChart() {
            const ctx = document.getElementById('trafficChart').getContext('2d');
            const initialLabels = Array.from({length: 20}, (_, i) => `${20 - i}秒前`).reverse();
            
            trafficChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: initialLabels,
                    datasets: [{
                        label: 'リクエスト数 / 秒',
                        data: new Array(20).fill(0),
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#1f2937' },
                            ticks: { color: '#9ca3af' }
                        },
                        x: {
                            grid: { color: '#1f2937' },
                            ticks: { color: '#9ca3af' }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#f3f4f6' } }
                    }
                }
            });
        }

        // 接続 / 切断 の切り替え
        function toggleConnection() {
            const btn = document.getElementById('connectBtn');
            const url = document.getElementById('wsUrl').value;

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
                return;
            }

            ws = new WebSocket(url);

            ws.onopen = function() {
                document.getElementById('connectionStatus').textContent = "接続中";
                document.getElementById('connectionStatus').className = "status-badge connected";
                btn.textContent = "切断";
                addLogItem("システム", "WebSocketサーバーに接続しました。", false);
            };

            ws.onclose = function() {
                document.getElementById('connectionStatus').textContent = "切断";
                document.getElementById('connectionStatus').className = "status-badge disconnected";
                btn.textContent = "接続";
                addLogItem("システム", "WebSocketサーバーとの接続が切れました。", true);
            };

            ws.onerror = function(error) {
                addLogItem("エラー", "WebSocket通信エラーが発生しました。", true);
            };

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);

                    // パスワード解除成功時の処理
                    if (data.type === "unblock_success") {
                        alert(data.message);
                        removeBlockedIPUI(data.ip);
                        return;
                    }
                    
                    // パスワード解除失敗時の処理
                    if (data.type === "unblock_failed") {
                        alert(data.message);
                        return;
                    }

                    // 通常のアクセスログ受信時の処理
                    if (data.ip) {
                        addLogItem(data.ip, `${data.method} ${data.path} - ${data.status}`, data.blocked);
                        
                        if (data.blocked) {
                            addBlockedIPUI(data.ip);
                        }

                        // グラフ更新（直近のデータに+1加算する簡易表現）
                        updateChartData();
                    }
                } catch (e) {
                    console.error("メッセージの解析に失敗しました:", e);
                }
            };
        }

        // ログストリームへの追加
        function addLogItem(source, text, isBlocked) {
            const container = document.getElementById('logStream');
            // 初期メッセージの削除
            if (container.children.length === 1 && container.children[0].style.color) {
                container.innerHTML = '';
            }

            const div = document.createElement('div');
            div.className = `log-item ${isBlocked ? 'blocked' : ''}`;
            const timeStr = new Date().toLocaleTimeString();
            div.innerHTML = `<span>[${timeStr}] <b>${source}</b>: ${text}</span>`;
            
            container.prepend(div);

            // 最大100件まで保持
            if (container.children.length > 100) {
                container.removeChild(container.lastChild);
            }
        }

        // グラフのデータ更新
        let currentRpsCount = 0;
        function updateChartData() {
            currentRpsCount++;
        }

        // 一定間隔でグラフのチャートを流す
        setInterval(() => {
            if (!trafficChart) return;
            const dataArr = trafficChart.data.datasets[0].data;
            dataArr.shift();
            dataArr.push(currentRpsCount);
            currentRpsCount = 0; // カウントリセット
            trafficChart.update('none');
        }, 1000);

        // ブロックIPテーブルへの追加
        function addBlockedIPUI(ip) {
            if (blockedIPsMap.has(ip)) return;
            blockedIPsMap.set(ip, true);

            const tbody = document.getElementById('blockedListTable');
            if (tbody.children.length === 1 && tbody.children[0].cells.length === 1) {
                tbody.innerHTML = ''; // プレースホルダー行を削除
            }

            const tr = document.createElement('tr');
            tr.id = `blocked-row-${ip.replace(/\./g, '_')}`;
            tr.innerHTML = `
                <td>${ip}</td>
                <td style="color: var(--accent-red); font-weight: bold;">DoS攻撃自動検知 (遮断中)</td>
                <td><button class="unblock-btn" onclick="requestUnblock('${ip}')">ブロック解除</button></td>
            `;
            tbody.appendChild(tr);
        }

        // ブロックIPテーブルからの削除
        function removeBlockedIPUI(ip) {
            blockedIPsMap.delete(ip);
            const rowId = `blocked-row-${ip.replace(/\./g, '_')}`;
            const row = document.getElementById(rowId);
            if (row) {
                row.remove();
            }

            const tbody = document.getElementById('blockedListTable');
            if (tbody.children.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">現在ブロック中のIPはありません</td></tr>`;
            }
        }

        // ブロック解除ボタン押下時の処理（パスワード認証プロンプト）
        function requestUnblock(targetIp) {
            const inputPassword = prompt(`[IP: ${targetIp}] ブロックを解除するためのパスワードを入力してください:`);
            
            if (!inputPassword) return;

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    action: "unblock",
                    ip: targetIp,
                    password: inputPassword
                }));
            } else {
                alert("WebSocketサーバーに接続されていません。");
            }
        }

        // 初期化実行
        window.onload = function() {
            initChart();
        };
    </script>
</body>
</html>
